name: Lint Shell

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run clippy (auto-fix)
        working-directory: shell
        run: cargo clippy --fix --locked --allow-dirty --all-targets --all-features -- -D warnings

      - name: Commit and push if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No lint fixes to apply."
            exit 0
          fi
          git add -A
          git commit -m "fix(shell): Apply clippy auto-fixes"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin master && git push && exit 0
            echo "Push failed (attempt $i), retrying..."
            sleep 5
          done
          echo "Could not push after retries." >&2
          exit 1
