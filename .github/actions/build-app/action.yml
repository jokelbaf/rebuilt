name: Build app
description: >
  Build the ReBuilt desktop app for the host OS: compile the backend into a Nuitka
  onefile sidecar, then bundle it with Tauri. Runs on Linux, Windows and macOS runners.

outputs:
  bundle-dir:
    description: Directory that holds the produced Tauri bundles.
    value: shell/target/release/bundle

runs:
  using: composite
  steps:
    - name: Install Linux system dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libjavascriptcoregtk-4.1-dev \
          libsoup-3.0-dev \
          librsvg2-dev \
          libxdo-dev \
          libssl-dev \
          libayatana-appindicator3-dev \
          patchelf \
          build-essential \
          file \
          rpm

    - name: Set up pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 11

    - name: Set up uv (Python 3.14)
      uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.14"
        enable-cache: true

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust build
      uses: swatinem/rust-cache@v2
      with:
        workspaces: shell

    - name: Install workspace dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Sync backend environment
      shell: bash
      working-directory: backend
      run: uv sync --frozen

    - name: Build desktop app
      shell: bash
      env:
        APPIMAGE_EXTRACT_AND_RUN: "1"
      run: pnpm build
