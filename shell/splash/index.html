<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ReBuilt</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #0a0a0a;
        --muted: #737373;
        --ring: #e5e5e5;
        --accent: #0a0a0a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --fg: #fafafa;
          --muted: #a3a3a3;
          --ring: #262626;
          --accent: #fafafa;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        background: var(--bg);
        color: var(--fg);
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      .spinner {
        width: 2.25rem;
        height: 2.25rem;
        border-radius: 50%;
        border: 2.5px solid var(--ring);
        border-top-color: var(--accent);
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .title {
        font-size: 1.35rem;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      .subtitle {
        font-size: 0.875rem;
        color: var(--muted);
        margin-top: -0.75rem;
      }
    </style>
  </head>
  <body>
    <div class="spinner"></div>
    <div class="title">ReBuilt</div>
    <div class="subtitle">Starting the application…</div>
  </body>
</html>
