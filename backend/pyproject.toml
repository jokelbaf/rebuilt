[project]
name = "backend"
version = "0.4.0"
description = "AI-powered resume builder backend"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.5",
    "beautifulsoup4>=4.15.0",
    "fastapi[standard]>=0.138.2",
    "httpx>=0.28.1",
    "jobboards",
    "langdetect>=1.0.9",
    "loguru>=0.7.3",
    "lxml>=6.1.1",
    "mcp>=1.28.1",
    "platformdirs>=4.10.0",
    "python-dotenv>=1.2.2",
    "sqlmodel>=0.0.39",
    "weasyprint>=69.0",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
jobboards = { workspace = true }

[dependency-groups]
dev = [
    "nuitka>=4.1.3",
    "patchelf>=0.17.2.4 ; sys_platform == 'linux'",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.15.20",
]

[tool.pyright]
include = ["app", "packages"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
# Route/exception handlers are registered via decorators, so pyright sees them as unused.
reportUnusedFunction = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "B008",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
