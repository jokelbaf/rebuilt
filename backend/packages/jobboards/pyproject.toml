[project]
name = "jobboards"
version = "0.1.0"
description = "Authenticated job-board client wrappers for ReBuilt vacancy discovery"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "pydantic>=2.13.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobboards"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
